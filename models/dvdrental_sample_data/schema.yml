version: 1

sources:
  - name: dvdrental_sample_data
    description: "Sample data source for dbt project."
    database: db_demo
    schema: sch_dvdrental
    loader: sample_loader

    tables:
      - name: actor
        description: "Table containing actor information."
        columns:
          - name: actor_id
            description: "Unique identifier for the actor."
            tests:
              - unique
              - not_null
          - name: first_name
            description: "First name of the actor."
          - name: last_name
            description: "Last name of the actor."
          - name: last_update
            description: "Timestamp of the last update to the actor record."


      - name: address
        description: "Table containing address information."
        columns:
          - name: address_id
            description: "Unique identifier for the address."
          - name: address
            description: "The street address."
          - name: district
            description: "The district where the address is located."
          - name: city_id
            description: "Identifier for the city where the address is located."
          - name: postal_code
            description: "The postal code for the address."
          - name: phone
            description: "The phone number for the address."
          - name: last_update
            description: "Timestamp of the last update to the address record."

      - name: category
        description: "Table containing category information."

      - name: city
        description: "Table containing city information."

      - name: country
        description: "Table containing country information."

      - name: customer
        description: "Table containing customer information."

      - name: film
        description: "Table containing film information."

      - name: film_actor
        description: "Table containing film actor information."

      - name: film_category
        description: "Table containing film category information."

      - name: inventory
        description: "Table containing inventory information."

      - name: language
        description: "Table containing language information."

      - name: payment
        description: "Table containing payment information."

      - name: rental
        description: "Table containing rental information."

      - name: staff
        description: "Table containing staff information."
        
      - name: store
        description: "Table containing store information."


